spring.application.name=iot-api
server.port=8080

# InfluxDB
influxdb.url=${INFLUXDB_URL:http://localhost:8086}
influxdb.token=${INFLUXDB_TOKEN:}
influxdb.org=${INFLUXDB_ORG:iot}
influxdb.bucket=${INFLUXDB_BUCKET:iot_data}

# API
api.default-range=PT1H
api.latest-range=P30D
api.default-limit=1000
api.max-limit=5000