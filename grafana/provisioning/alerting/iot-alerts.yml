apiVersion: 1
groups:
    - orgId: 1
      name: iot-alerts
      folder: IoT
      interval: 1m
      rules:
        - uid: dg4zrsxgzbklcc
          title: Temperature supérieure à 30°C
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: influxdb-iot
              model:
                intervalMs: 1000
                maxDataPoints: 43200
                query: "from(bucket: \"iot_data\")\r\n  |> range(start: -5m)\r\n  |> filter(fn: (r) => r._measurement == \"temperature\")\r\n  |> filter(fn: (r) => r._field == \"value\")\r\n  |> group(columns: [\"device_id\"])\r\n  |> keep(columns: [\"_time\", \"_value\", \"device_id\"])"
                refId: A
            - refId: B
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params: []
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - B
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: B
                type: reduce
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 30
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: B
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 1m
          annotations:
            description: La température du capteur {{ $labels.device_id }} dépasse le seuil de 30 °C.
            summary: Température élevée détectée
          isPaused: false
          notification_settings:
            receiver: IoT-Notifications
