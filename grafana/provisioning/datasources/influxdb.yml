apiVersion: 1

datasources:
  - name: InfluxDB-IoT
    uid: influxdb-iot
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: iot
      defaultBucket: iot_data
      tlsSkipVerify: false
    secureJsonData:
      token: $INFLUXDB_TOKEN
